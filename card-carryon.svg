<text x="28" y="142" class="m b" font-size="10.5" letter-spacing="1.5">THE PROBLEM</text><text x="28" y="160" class="t" font-size="12.5">Cloud storage means monthly fees and trusting someone</text><text x="28" y="178" class="t" font-size="12.5">else with your files.</text><text x="28" y="210" class="a b" font-size="10.5" letter-spacing="1.5">THE TWIST</text><text x="28" y="228" class="t" font-size="12.5">Uses your own Telegram storage as the backend. No</text><text x="28" y="246" class="t" font-size="12.5">separate database.</text><rect x="28" y="268" width="70.4" height="24" rx="12" fill="#1F1E1D" stroke="#3A3835"/><text x="63.2" y="284" text-anchor="middle" class="m" font-size="11">Flutter</text><rect x="106.4" y="268" width="77.6" height="24" rx="12" fill="#1F1E1D" stroke="#3A3835"/><text x="145.2" y="284" text-anchor="middle" class="m" font-size="11">Telegram</text><rect x="192.0" y="268" width="77.6" height="24" rx="12" fill="#1F1E1D" stroke="#3A3835"/><text x="230.8" y="284" text-anchor="middle" class="m" font-size="11">Metadata</text><text x="452" y="284" text-anchor="end" class="a b" font-size="12">VIEW REPO →</text>
